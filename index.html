
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Clone</title>

<style>
:root {
  --bg: #0f0f0f;
  --surface: #212121;
  --hover: #303030;
  --text: #f1f1f1;
  --muted: #aaa;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
  border: 0;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 24px;
  z-index: 10;
}

.header-left, .header-right, .search-area {
  display: flex;
  align-items: center;
  gap: 16px;
}

.icon-btn {
  background: transparent;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 21px;
}

.icon-btn:hover {
  background: var(--hover);
}

.logo {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 21px;
  font-weight: bold;
  letter-spacing: -1px;
  white-space: nowrap;
}

.logo-symbol {
  background: #ff0033;
  color: white;
  border-radius: 8px;
  padding: 3px 7px;
  font-size: 17px;
}

.search-area {
  flex: 1;
  max-width: 640px;
  gap: 0;
  margin: 0 auto;
}

.search-area input {
  min-width: 0;
  width: 100%;
  height: 42px;
  background: #121212;
  color: white;
  border: 1px solid #303030;
  border-radius: 24px 0 0 24px;
  padding: 0 18px;
  outline: none;
  font-size: 16px;
}

.search-area input:focus {
  border-color: #1c62b9;
}

.search-btn {
  height: 42px;
  width: 65px;
  background: #303030;
  border: 1px solid #303030;
  border-radius: 0 24px 24px 0;
  font-size: 19px;
}

.mic-btn {
  margin-left: 12px;
  background: #272727;
}

.sidebar {
  position: fixed;
  top: 64px;
  left: 0;
  bottom: 0;
  width: 230px;
  padding: 12px;
  overflow-y: auto;
  background: var(--bg);
  transition: width .15s;
}

.sidebar nav {
  border-bottom: 1px solid #333;
  padding-bottom: 12px;
  margin-bottom: 12px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 24px;
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  text-align: left;
  border-radius: 10px;
  background: transparent;
  font-size: 14px;
}

.nav-item:hover, .nav-item.active {
  background: var(--hover);
}

.nav-icon {
  font-size: 20px;
  width: 22px;
  text-align: center;
}

.nav-title {
  font-weight: bold;
  padding: 8px 12px;
}

.sidebar p {
  color: var(--muted);
  font-size: 12px;
  padding: 18px 12px;
  line-height: 1.6;
}

main {
  margin-left: 230px;
  padding: 80px 24px 30px;
}

.categories {
  position: fixed;
  top: 64px;
  left: 230px;
  right: 0;
  z-index: 5;
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 12px 24px;
  background: var(--bg);
  scrollbar-width: none;
}

.categories button {
  white-space: nowrap;
  padding: 9px 13px;
  border-radius: 8px;
  background: #272727;
  font-size: 14px;
}

.categories button:hover {
  background: #414141;
}

.categories button.active {
  background: white;
  color: #111;
}

.section-title {
  font-size: 21px;
  margin: 14px 0 20px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 34px 16px;
}

.video-card {
  min-width: 0;
  cursor: pointer;
}

.thumbnail {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 12px;
  background: #272727;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.duration {
  position: absolute;
  right: 7px;
  bottom: 7px;
  background: rgba(0,0,0,.85);
  color: white;
  font-size: 12px;
  padding: 4px 5px;
  border-radius: 4px;
}

.video-info {
  display: flex;
  gap: 12px;
  padding-top: 12px;
}

.channel-avatar {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #333;
  object-fit: cover;
}

.video-text {
  min-width: 0;
  flex: 1;
}

.video-text h3 {
  font-size: 15px;
  line-height: 1.4;
  font-weight: 600;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.video-text p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  margin-top: 4px;
}

.more-btn {
  background: transparent;
  font-size: 20px;
  align-self: flex-start;
}

.message {
  color: var(--muted);
  text-align: center;
  padding: 50px 10px;
  grid-column: 1 / -1;
}

.load-more {
  display: block;
  margin: 35px auto;
  background: var(--surface);
  padding: 12px 24px;
  border-radius: 22px;
}

.load-more:hover {
  background: #383838;
}

.player-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  z-index: 30;
  padding: 24px;
  overflow-y: auto;
}

.player-modal.open {
  display: block;
}

.close-player {
  display: block;
  margin: 0 0 16px auto;
  background: #303030;
  border-radius: 22px;
  padding: 10px 18px;
}

.player-content {
  max-width: 1000px;
  margin: 0 auto;
}

.player-frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 12px;
  background: black;
}

#playerTitle {
  font-size: 21px;
  margin: 16px 0 10px;
}

#playerChannel {
  color: var(--muted);
}

@media (max-width: 1200px) {
  .video-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 800px) {
  .sidebar {
    width: 74px;
    padding: 8px;
  }

  .nav-item {
    justify-content: center;
    padding: 0;
  }

  .nav-item span:last-child,
  .nav-title,
  .sidebar p {
    display: none;
  }

  .categories {
    left: 74px;
  }

  main {
    margin-left: 74px;
    padding-left: 14px;
    padding-right: 14px;
  }

  .header {
    padding: 0 12px;
    gap: 8px;
  }

  .logo {
    font-size: 17px;
  }

  .mic-btn, .header-right .create-btn {
    display: none;
  }
}

@media (max-width: 560px) {
  .video-grid {
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .thumbnail {
    border-radius: 8px;
  }

  .header-left {
    gap: 4px;
  }

  .search-area input {
    font-size: 14px;
    padding: 0 10px;
  }

  .search-btn {
    width: 44px;
  }

  .logo span:last-child {
    display: none;
  }

  main {
    padding-top: 78px;
  }
}
</style>
</head>

<body>
<header class="header">
  <div class="header-left">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="logo">
      <span class="logo-symbol">▶</span>
      <span>YouTube</span>
    </div>
  </div>

  <form class="search-area" id="searchForm">
    <input id="searchInput" type="search" placeholder="Pesquisar" autocomplete="off">
    <button class="search-btn" aria-label="Pesquisar">⌕</button>
    <button class="icon-btn mic-btn" type="button" title="Pesquisa por voz">🎙</button>
  </form>

  <div class="header-right">
    <button class="icon-btn create-btn" id="createBtn" title="Criar">＋</button>
    <button class="icon-btn" id="notificationsBtn" title="Notificações">♧</button>
    <button class="icon-btn" title="Perfil">👤</button>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <nav>
    <button class="nav-item active" data-home>
      <span class="nav-icon">⌂</span><span>Início</span>
    </button>
    <button class="nav-item" data-query="Shorts">
      <span class="nav-icon">▶</span><span>Shorts</span>
    </button>
    <button class="nav-item" data-query="música">
      <span class="nav-icon">▤</span><span>Inscrições</span>
    </button>
  </nav>

  <nav>
    <div class="nav-title">Você　›</div>
    <button class="nav-item" data-query="vídeos populares">
      <span class="nav-icon">◴</span><span>Histórico</span>
    </button>
    <button class="nav-item" id="savedBtn">
      <span class="nav-icon">▣</span><span>Assistir mais tarde</span>
    </button>
    <button class="nav-item" data-query="videoclipes oficiais">
      <span class="nav-icon">▤</span><span>Playlists</span>
    </button>
  </nav>

  <nav>
    <div class="nav-title">Explorar</div>
    <button class="nav-item" data-query="música brasileira">
      <span class="nav-icon">♫</span><span>Música</span>
    </button>
    <button class="nav-item" data-query="jogos gameplay">
      <span class="nav-icon">🎮</span><span>Jogos</span>
    </button>
    <button class="nav-item" data-query="notícias Brasil">
      <span class="nav-icon">▤</span><span>Notícias</span>
    </button>
    <button class="nav-item" data-query="esportes melhores momentos">
      <span class="nav-icon">⚽</span><span>Esportes</span>
    </button>
  </nav>

  <p>Este é um projeto demonstrativo independente, não oficial do YouTube.</p>
</aside>

<div class="categories" id="categories">
  <button class="active" data-category="Início">Tudo</button>
  <button data-category="música">Música</button>
  <button data-category="jogos">Jogos</button>
  <button data-category="programação">Programação</button>
  <button data-category="notícias">Notícias</button>
  <button data-category="esportes">Esportes</button>
  <button data-category="podcasts">Podcasts</button>
  <button data-category="comédia">Comédia</button>
  <button data-category="tecnologia">Tecnologia</button>
  <button data-category="culinária">Culinária</button>
</div>

<main>
  <h2 class="section-title" id="sectionTitle">Recomendados para você</h2>
  <section class="video-grid" id="videoGrid">
    <div class="message">Carregando vídeos...</div>
  </section>
  <button class="load-more" id="loadMore" hidden>Carregar mais vídeos</button>
</main>

<div class="player-modal" id="playerModal">
  <button class="close-player" id="closePlayer">✕ Fechar vídeo</button>
  <div class="player-content">
    <iframe class="player-frame" id="playerFrame"
      title="Reprodutor de vídeo do YouTube"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
    <h2 id="playerTitle"></h2>
    <p id="playerChannel"></p>
  </div>
</div>

<script>
/*
  CONFIGURAÇÃO:
  Cole sua chave da YouTube Data API v3 abaixo.
  Exemplo: const API_KEY = "SUA_CHAVE_AQUI";
*/
const API_KEY = "AIzaSyBnbZZ7qFBXaIKLfOASLKlHAFtm2eaD06c";

const videoGrid = document.getElementById("videoGrid");
const searchInput = document.getElementById("searchInput");
const searchForm = document.getElementById("searchForm");
const sectionTitle = document.getElementById("sectionTitle");
const loadMoreBtn = document.getElementById("loadMore");
const playerModal = document.getElementById("playerModal");
const playerFrame = document.getElementById("playerFrame");

let nextPageToken = "";
let currentQuery = "";
let loading = false;
let currentVideos = [];
let savedVideos = JSON.parse(localStorage.getItem("ytSavedVideos") || "[]");

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatViews(value) {
  const n = Number(value || 0);
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(".", ",") + " bi visualizações";
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(".", ",") + " mi visualizações";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(".", ",") + " mil visualizações";
  return n + " visualizações";
}

function formatDate(dateString) {
  if (!dateString) return "";
  const date = new Date(dateString);
  const days = Math.floor((Date.now() - date.getTime()) / 86400000);
  if (days < 1) return "hoje";
  if (days < 30) return `há ${days} dias`;
  if (days < 365) return `há ${Math.floor(days / 30)} meses`;
  return `há ${Math.floor(days / 365)} anos`;
}

async function apiRequest(endpoint, params = {}) {
  if (!API_KEY || API_KEY === "SUA_CHAVE_AQUI") {
    throw new Error("Configure sua chave da YouTube Data API v3 no código.");
  }

  const url = new URL("https://www.googleapis.com/youtube/v3/" + endpoint);
  url.search = new URLSearchParams({
    ...params,
    key: API_KEY
  });

  const response = await fetch(url);
  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error?.message || "Não foi possível carregar os vídeos.");
  }
  return data;
}

async function searchVideos(query = "", append = false) {
  if (loading) return;
  loading = true;
  currentQuery = query;

  if (!append) {
    nextPageToken = "";
    currentVideos = [];
    videoGrid.innerHTML = '<div class="message">Carregando vídeos...</div>';
    loadMoreBtn.hidden = true;
  }

  sectionTitle.textContent = query
    ? `Resultados para: ${query}`
    : "Recomendados para você";

  try {
    const params = {
      part: "snippet",
      type: "video",
      maxResults: "12",
      regionCode: "BR",
      relevanceLanguage: "pt"
    };

    if (query) params.q = query;
    if (append && nextPageToken) params.pageToken = nextPageToken;

    const result = await apiRequest("search", params);
    nextPageToken = result.nextPageToken || "";

    const videos = (result.items || [])
      .filter(item => item.id?.videoId)
      .map(item => ({
        id: item.id.videoId,
        title: item.snippet.title,
        channel: item.snippet.channelTitle,
        channelId: item.snippet.channelId,
        publishedAt: item.snippet.publishedAt,
        thumbnail: item.snippet.thumbnails?.high?.url ||
                   item.snippet.thumbnails?.medium?.url ||
                   item.snippet.thumbnails?.default?.url
      }));

    if (videos.length) {
      const ids = videos.map(video => video.id).join(",");
      const details = await apiRequest("videos", {
        part: "statistics,contentDetails",
        id: ids
      });

      const detailsById = {};
      (details.items || []).forEach(item => {
        detailsById[item.id] = item;
      });

      videos.forEach(video => {
        const info = detailsById[video.id];
        video.views = info?.statistics?.viewCount || 0;
        video.duration = formatDuration(info?.contentDetails?.duration || "");
      });
    }

    currentVideos = append ? currentVideos.concat(videos) : videos;
    renderVideos(append);
    loadMoreBtn.hidden = !nextPageToken;
  } catch (error) {
    if (!append) {
      videoGrid.innerHTML = `
        <div class="message">
          <h3>Não foi possível carregar os vídeos</h3>
          <p style="margin-top:12px">${escapeHTML(error.message)}</p>
          <p style="margin-top:12px">
            Confira sua chave da API e se a YouTube Data API v3 está ativada.
          </p>
        </div>`;
    } else {
      alert(error.message);
    }
  } finally {
    loading = false;
  }
}

function formatDuration(duration) {
  const match = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!match) return "";
  const h = Number(match[1] || 0);
  const m = Number(match[2] || 0);
  const s = Number(match[3] || 0);

  if (h) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function renderVideos(append = false) {
  if (!append) videoGrid.innerHTML = "";

  if (!currentVideos.length) {
    videoGrid.innerHTML = '<div class="message">Nenhum vídeo encontrado.</div>';
    return;
  }

  const start = append
    ? videoGrid.querySelectorAll(".video-card").length
    : 0;

  currentVideos.slice(start).forEach(video => {
    const card = document.createElement("article");
    card.className = "video-card";
    card.innerHTML = `
      <div class="thumbnail">
        <img src="${escapeHTML(video.thumbnail || "")}"
             alt="${escapeHTML(video.title)}"
             loading="lazy">
        <span class="duration">${escapeHTML(video.duration || "")}</span>
      </div>
      <div class="video-info">
        <img class="channel-avatar"
             src="https://www.youtube.com/s/desktop/12c7e3f0/img/favicon_144x144.png"
             alt="">
        <div class="video-text">
          <h3>${escapeHTML(video.title)}</h3>
          <p>${escapeHTML(video.channel)}</p>
          <p>${formatViews(video.views)} · ${formatDate(video.publishedAt)}</p>
        </div>
        <button class="more-btn" aria-label="Mais opções" title="Mais opções">⋮</button>
      </div>`;

    card.querySelector(".thumbnail").addEventListener("click", () => playVideo(video));
    card.querySelector(".video-text").addEventListener("click", () => playVideo(video));

    card.querySelector(".more-btn").addEventListener("click", event => {
      event.stopPropagation();
      const action = prompt(
        "Digite 1 para assistir mais tarde ou 2 para abrir no YouTube:"
      );
      if (action === "1") saveVideo(video);
      if (action === "2") {
        window.open("https://www.youtube.com/watch?v=" + encodeURIComponent(video.id), "_blank");
      }
    });

    videoGrid.appendChild(card);
  });
}

function playVideo(video) {
  document.getElementById("playerTitle").textContent = video.title;
  document.getElementById("playerChannel").textContent = video.channel;
  playerFrame.src =
    "https://www.youtube.com/embed/" + encodeURIComponent(video.id) +
    "?autoplay=1&rel=0";
  playerModal.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closePlayer() {
  playerModal.classList.remove("open");
  playerFrame.src = "";
  document.body.style.overflow = "";
}

function saveVideo(video) {
  if (savedVideos.some(item => item.id === video.id)) {
    alert("Este vídeo já está salvo.");
    return;
  }
  savedVideos.push(video);
  localStorage.setItem("ytSavedVideos", JSON.stringify(savedVideos));
  alert("Vídeo salvo em Assistir mais tarde!");
}

function showSavedVideos() {
  currentVideos = savedVideos;
  nextPageToken = "";
  sectionTitle.textContent = "Assistir mais tarde";
  loadMoreBtn.hidden = true;
  renderVideos();
}

searchForm.addEventListener("submit", event => {
  event.preventDefault();
  searchVideos(searchInput.value.trim());
});

document.getElementById("categories").addEventListener("click", event => {
  const button = event.target.closest("button[data-category]");
  if (!button) return;

  document.querySelectorAll("#categories button").forEach(item =>
    item.classList.toggle("active", item === button)
  );

  const category = button.dataset.category;
  searchInput.value = category === "Início" ? "" : category;
  searchVideos(searchInput.value.trim());
});

document.querySelectorAll(".nav-item[data-query]").forEach(button => {
  button.addEventListener("click", () => {
    searchInput.value = button.dataset.query;
    searchVideos(button.dataset.query);
  });
});

document.querySelector("[data-home]").addEventListener("click", () => {
  searchInput.value = "";
  searchVideos("");
});

document.getElementById("savedBtn").addEventListener("click", showSavedVideos);
loadMoreBtn.addEventListener("click", () => searchVideos(currentQuery, true));
document.getElementById("closePlayer").addEventListener("click", closePlayer);

playerModal.addEventListener("click", event => {
  if (event.target === playerModal) closePlayer();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closePlayer();
});

document.getElementById("menuBtn").addEventListener("click", () => {
  const sidebar = document.getElementById("sidebar");
  const categories = document.getElementById("categories");
  const main = document.querySelector("main");

  const collapsed = sidebar.dataset.collapsed === "true";

  if (collapsed) {
    sidebar.style.display = "";
    sidebar.style.width = "";
    categories.style.left = "";
    main.style.marginLeft = "";
    sidebar.dataset.collapsed = "false";
  } else {
    sidebar.style.display = "none";
    categories.style.left = "0";
    main.style.marginLeft = "0";
    sidebar.dataset.collapsed = "true";
  }
});

document.getElementById("createBtn").addEventListener("click", () => {
  alert("Demonstração: para enviar vídeos, seria necessário implementar autenticação OAuth e usar a API oficial.");
});

document.getElementById("notificationsBtn").addEventListener("click", () => {
  alert("As notificações reais exigem uma conta autenticada.");
});

// A primeira busca só funciona depois de configurar a chave da API.
searchVideos("");



  








</script>
</body>
</html>
